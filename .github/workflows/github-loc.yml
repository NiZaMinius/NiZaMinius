name: Generate GitHub LOC Chart

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  generate-loc-chart:
    name: Generate quarterly code changes chart
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub LOC chart
        uses: anmol098/waka-readme-stats@f3a05a90cddf436185171f5c2d91af3478fc10c3
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECTION_NAME: github-loc
          LOCALE: en
          SHOW_OS: "False"
          SHOW_PROJECTS: "False"
          SHOW_EDITORS: "False"
          SHOW_TIMEZONE: "False"
          SHOW_COMMIT: "False"
          SHOW_LANGUAGE: "False"
          SHOW_LINES_OF_CODE: "False"
          SHOW_LANGUAGE_PER_REPO: "False"
          SHOW_LOC_CHART: "True"
          SHOW_DAYS_OF_WEEK: "False"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_SHORT_INFO: "False"
          SHOW_UPDATED_DATE: "False"
          SHOW_TOTAL_CODE_TIME: "False"
          SHOW_AI_CODE_TIME: "False"
          SHOW_AI_CODING: "False"
          MAX_REPOS: "0"

  style-loc-chart:
    name: Style chart for the dark profile theme
    needs: generate-loc-chart
    runs-on: ubuntu-latest
    steps:
      - name: Check out updated profile repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install image processing dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Make the generated chart transparent and readable
        run: python scripts/style_loc_chart.py assets/bar_graph.png

      - name: Commit styled chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/bar_graph.png
          if git diff --cached --quiet; then
            echo "LOC chart already has the expected styling."
            exit 0
          fi
          git commit -m "chore: style GitHub LOC chart"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
