name: Generate GitHub LOC Chart

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  generate-loc-chart:
    name: Generate quarterly code changes chart
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub LOC chart
        uses: anmol098/waka-readme-stats@f3a05a90cddf436185171f5c2d91af3478fc10c3
        with:
          WAKATIME_API_KEY: \${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: \${{ secrets.GH_TOKEN }}
          PUSH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          SECTION_NAME: github-loc
          LOCALE: en
          SHOW_OS: "False"
          SHOW_PROJECTS: "False"
          SHOW_EDITORS: "False"
          SHOW_TIMEZONE: "False"
          SHOW_COMMIT: "False"
          SHOW_LANGUAGE: "False"
          SHOW_LINES_OF_CODE: "False"
          SHOW_LANGUAGE_PER_REPO: "False"
          SHOW_LOC_CHART: "True"
          SHOW_DAYS_OF_WEEK: "False"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_SHORT_INFO: "False"
          SHOW_UPDATED_DATE: "False"
          SHOW_TOTAL_CODE_TIME: "False"
          SHOW_AI_CODE_TIME: "False"
          SHOW_AI_CODING: "False"
          MAX_REPOS: "0"
