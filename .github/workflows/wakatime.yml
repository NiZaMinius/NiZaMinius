name: Generate WakaTime SVGs

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  generate-wakatime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate WakaTime cards
        env:
          WAKATIME_OAUTH_TOKEN: ${{ secrets.WAKATIME_OAUTH_TOKEN }}
        run: python scripts/generate_wakatime.py

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/wakatime-overview.svg assets/wakatime-languages.svg
          if git diff --cached --quiet; then
            echo "WakaTime SVGs are already up to date."
            exit 0
          fi
          git commit -m "chore: refresh WakaTime statistics"
          branch="$(git branch --show-current)"
git pull --rebase origin "$branch"
          git push origin "HEAD:$branch"
