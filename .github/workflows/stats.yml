name: Generate GitHub Stats Images

on:
  schedule:
    # Regenerate once a day so stats stay fresh.
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  generate-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=NiZaMinius&show_icons=true&custom_title=NiZaMinius&theme=tokyonight"
          path: overview.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=NiZaMinius&layout=compact&custom_title=NiZaMinius&langs_count=6&theme=tokyonight"
          path: languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add overview.svg languages.svg
          git diff --staged --quiet || git commit -m "chore: refresh stats images"
          git push
