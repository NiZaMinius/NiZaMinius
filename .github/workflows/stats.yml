name: Generate GitHub Stats Images

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  generate-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate GitHub profile statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=NiZaMinius&show_icons=true&custom_title=GitHub%20Stats&title_color=A78BFA&text_color=C9C1D9&icon_color=C4B5FD&bg_color=00000000&hide_border=true"
          path: overview.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Mask excluded repository names
        env:
          STATS_EXCLUDED_REPOS: ${{ secrets.STATS_EXCLUDED_REPOS }}
        shell: bash
        run: |
          if [[ -z "$STATS_EXCLUDED_REPOS" ]]; then
            echo "::error::STATS_EXCLUDED_REPOS secret is missing."
            exit 1
          fi

          IFS=',' read -r -a excluded_repos <<< "$STATS_EXCLUDED_REPOS"
          for repo in "${excluded_repos[@]}"; do
            if [[ -z "$repo" || "$repo" == *[[:space:]]* ]]; then
              echo "::error::STATS_EXCLUDED_REPOS must be a comma-separated list without spaces or empty entries."
              exit 1
            fi
            printf '::add-mask::%s\n' "$repo"
          done

      - name: Generate GitHub language distribution
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=NiZaMinius&layout=compact&custom_title=Most%20Used%20Languages&langs_count=6&card_width=420&size_weight=1&count_weight=0&exclude_repo=${{ secrets.STATS_EXCLUDED_REPOS }}&title_color=A78BFA&text_color=C9C1D9&icon_color=C4B5FD&bg_color=00000000&hide_border=true"
          path: languages.svg
          token: ${{ secrets.GH_TOKEN }}
          fail_on_error: true

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add overview.svg languages.svg
          if git diff --cached --quiet; then
            echo "GitHub stats cards are already up to date."
            exit 0
          fi
          git commit -m "chore: refresh GitHub stats"
          branch="$(git branch --show-current)"
          git pull --rebase origin "$branch"
          git push origin "HEAD:$branch"
